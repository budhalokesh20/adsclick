openapi: 3.0.3
info:
  title: AdShare API
  version: 0.1.0
  description: |
    Passive advertising & revenue-sharing platform API (phase 2: auth + users).
    Full contract: docs/03-api-contract.md
servers:
  - url: /api/v1
tags:
  - name: auth
  - name: users
paths:
  /health:
    get:
      summary: Liveness probe
      tags: [system]
      responses:
        '200': { description: OK }
  /auth/register:
    post:
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '409': { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/refresh:
    post:
      tags: [auth]
      summary: Rotate refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: New token bundle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      tags: [auth]
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: No content }
  /auth/verify-email:
    post:
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200': { description: Verified }
        '400': { $ref: '#/components/responses/Error' }
  /auth/forgot-password:
    post:
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '204': { description: Always 204 (no enumeration) }
  /auth/reset-password:
    post:
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        '204': { description: Reset }
        '400': { $ref: '#/components/responses/Error' }
  /auth/sessions:
    get:
      tags: [auth]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Session list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Session' }
    delete:
      tags: [auth]
      security: [{ bearerAuth: [] }]
      summary: Revoke all sessions
      responses:
        '204': { description: No content }
  /auth/sessions/{id}:
    delete:
      tags: [auth]
      security: [{ bearerAuth: [] }]
      summary: Revoke a single session
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: No content }
        '400': { $ref: '#/components/responses/Error' }
  /users/me:
    get:
      tags: [users]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Profile + wallet }
    patch:
      tags: [users]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileInput' }
      responses:
        '200': { description: Updated }
    delete:
      tags: [users]
      security: [{ bearerAuth: [] }]
      summary: Request account deletion (soft)
      responses:
        '204': { description: No content }
  /users/me/password:
    patch:
      tags: [users]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        '204': { description: Changed }
        '400': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 72 }
        fullName: { type: string }
        referralCode: { type: string, pattern: '^[A-Z0-9]{4,12}$' }
        deviceId: { type: string }
        platform: { type: string, enum: [ANDROID, IOS] }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        deviceId: { type: string }
        platform: { type: string, enum: [ANDROID, IOS] }
    AuthResponse:
      type: object
      properties:
        user: { $ref: '#/components/schemas/PublicUser' }
        accessToken: { type: string }
        refreshToken: { type: string }
        sessionId: { type: string }
        expiresAt: { type: string, format: date-time }
    PublicUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        fullName: { type: string, nullable: true }
        countryCode: { type: string, nullable: true }
        locale: { type: string, nullable: true }
        emailVerified: { type: boolean }
        status: { type: string }
        referralCode: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    UpdateProfileInput:
      type: object
      properties:
        fullName: { type: string, nullable: true }
        countryCode: { type: string, nullable: true }
        locale: { type: string, nullable: true }
        notificationPrefs:
          type: object
          properties:
            earnings: { type: boolean }
            withdrawals: { type: boolean }
            marketing: { type: boolean }
    Session:
      type: object
      properties:
        id: { type: string, format: uuid }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        ipAddress: { type: string, nullable: true }
        userAgent: { type: string, nullable: true }
        device: { type: object, nullable: true }
  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string }
                  message: { type: string }
                  details: { type: object }
